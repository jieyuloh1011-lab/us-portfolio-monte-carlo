name: Run Monte Carlo Simulation

on:
  workflow_dispatch:
    inputs:
      initial_capital:
        description: 'Starting Portfolio Capital ($ USD)'
        required: true
        default: '100000'
        type: string
      num_simulations:
        description: 'Number of Monte Carlo Simulations'
        required: true
        default: '10000'
        type: string
      horizon_days:
        description: 'Simulation Horizon (Trading Days, 252 = 1 Yr)'
        required: true
        default: '252'
        type: string
      confidence_level:
        description: 'VaR Confidence Level (e.g., 95 or 99)'
        required: true
        default: '95'
        type: choice
        options:
          - '90'
          - '95'
          - '99'
      risk_free_rate:
        description: 'Annual risk-free rate as decimal (0.0425 = 4.25%)'
        required: true
        default: '0.0425'
        type: string
      weighting:
        description: 'Portfolio Weighting Strategy'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'equal'
          - 'market_cap'

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Monte Carlo Simulation
        env:
          CAPITAL: ${{ github.event.inputs.initial_capital }}
          SIMS: ${{ github.event.inputs.num_simulations }}
          DAYS: ${{ github.event.inputs.horizon_days }}
          CONFIDENCE: ${{ github.event.inputs.confidence_level }}
          RF: ${{ github.event.inputs.risk_free_rate }}
          WEIGHTING: ${{ github.event.inputs.weighting }}
        run: |
          python simulation.py \
            --capital "$CAPITAL" \
            --sims "$SIMS" \
            --days "$DAYS" \
            --confidence "$CONFIDENCE" \
            --rf "$RF" \
            --weighting "$WEIGHTING"

      - name: Commit and push updated chart & cache
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add monte_carlo_chart.png fallback_prices.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Monte Carlo simulation results"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
